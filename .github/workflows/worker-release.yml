name: Worker release

on:
  workflow_call:
    inputs:
      operation:
        description: verify, publish, rehearse or activate
        required: true
        type: string
      project:
        description: Worker project directory
        type: string
        default: '.'
      targets:
        description: JSON array of allowed target names
        required: true
        type: string
      environment-prefix:
        description: Prefix for protected GitHub environments
        type: string
        default: worker
      tag:
        description: Exact release tag for publication or activation
        type: string
        default: ''
      target:
        description: One target for an activation
        type: string
        default: ''
    secrets:
      CLOUDFLARE_API_TOKEN:
        description: Deployment token resolved from the selected caller environment.
        required: false

jobs:
  identity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      commit: ${{ steps.identity.outputs.commit }}
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate the target allowlist
        id: targets
        shell: bash
        env:
          TARGETS: ${{ inputs.targets }}
        run: |
          set -euo pipefail
          validated=$(jq -ce '
            select(type == "array" and length > 0 and length <= 16)
            | select(all(.[]; type == "string" and test("^[a-z0-9]+(-[a-z0-9]+)*$") and length <= 40))
            | select(length == (unique | length))
          ' <<< "$TARGETS")
          echo "targets=$validated" >> "$GITHUB_OUTPUT"
      - name: Verify the exact source and request
        id: identity
        shell: bash
        env:
          OPERATION: ${{ inputs.operation }}
          TARGETS: ${{ steps.targets.outputs.targets }}
          TARGET: ${{ inputs.target }}
          TAG: ${{ inputs.tag }}
          PREFIX: ${{ inputs.environment-prefix }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [[ "$OPERATION" == verify ]]; then
            [[ -z "$TAG" && -z "$TARGET" ]]
            echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$GITHUB_REF" == "refs/heads/$DEFAULT_BRANCH" && "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          commit=$(git rev-parse "refs/tags/${TAG}^{commit}")
          git merge-base --is-ancestor "$commit" HEAD
          case "$OPERATION" in
            publish) [[ -z "$TARGET" ]] ;;
            activate|rehearse)
              [[ "$PREFIX" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]]
              jq -e --arg target "$TARGET" 'index($target) != null' <<< "$TARGETS" >/dev/null
              ;;
            *) exit 1 ;;
          esac
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - name: Require a protected environment with an independent reviewer
        if: inputs.operation == 'activate'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ENVIRONMENT: ${{ inputs.environment-prefix }}-${{ inputs.target }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/environments/$ENVIRONMENT" | jq -e '
            (.deployment_branch_policy | (.protected_branches or .custom_branch_policies))
            and any(.protection_rules[];
              .type == "required_reviewers" and .prevent_self_review and (.reviewers | length > 0)
            )
          ' >/dev/null

  verify:
    if: inputs.operation == 'verify' || inputs.operation == 'publish'
    needs: identity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      matrix:
        target: ${{ fromJSON(needs.identity.outputs.targets) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.identity.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - id: verify
        uses: vhco-pro/worker-ci-action@2451d9b0aebea258785cddaf2ddb9264d787a4d6 # v0.1.0
        with:
          project: ${{ inputs.project }}
          target: ${{ matrix.target }}
          tag: ${{ inputs.tag }}
          commit: ${{ needs.identity.outputs.commit }}
      - if: inputs.operation == 'publish'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: worker-${{ matrix.target }}
          path: ${{ steps.verify.outputs.artifact }}
          if-no-files-found: error
          retention-days: 7

  publish:
    if: inputs.operation == 'publish'
    needs: [identity, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only the caller's publication job grants contents: write.
    concurrency:
      group: worker-publish-${{ github.repository }}-${{ inputs.tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: worker-*
          path: ${{ runner.temp }}/artifacts
      - name: Stage the verified release files
        shell: bash
        env:
          TARGETS: ${{ needs.identity.outputs.targets }}
          STAGE: ${{ runner.temp }}/artifacts
        run: |
          set -euo pipefail
          mkdir "$STAGE/release"
          for target in $(jq -r '.[]' <<< "$TARGETS"); do
            cp "$STAGE/worker-$target/worker.mjs" "$STAGE/release/$target.mjs"
            cp "$STAGE/worker-$target/manifest.json" "$STAGE/release/$target.json"
          done
      - name: Publish the immutable release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          STAGE: ${{ runner.temp }}/artifacts/release
          IMMUTABILITY_CONFIGURED: ${{ vars.WORKER_IMMUTABLE_RELEASES_ENABLED }}
        run: |
          set -euo pipefail
          [[ "$IMMUTABILITY_CONFIGURED" == true ]]
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --generate-notes "$STAGE"/*
          fi
      - name: Confirm immutable release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          STAGE: ${{ runner.temp }}/artifacts/release
        run: |
          set -euo pipefail
          release=$(gh api "repos/$GH_REPO/releases/tags/$TAG")
          jq -e '.immutable and (.draft | not)' <<< "$release" >/dev/null
          for asset in "$STAGE"/*; do
            hash=$(sha256sum "$asset")
            jq -e --arg name "${asset##*/}" --arg digest "sha256:${hash%% *}" \
              'any(.assets[]; .name == $name and .digest == $digest)' <<< "$release" >/dev/null
          done

  activate:
    if: (inputs.operation == 'activate' || inputs.operation == 'rehearse') && github.event_name == 'workflow_dispatch'
    needs: identity
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    environment: ${{ inputs.environment-prefix }}-${{ inputs.target }}
    concurrency:
      group: worker-activate-${{ github.repository }}-${{ inputs.environment-prefix }}-${{ inputs.target }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.identity.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Download the selected immutable release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          TARGET: ${{ inputs.target }}
          STAGE: ${{ runner.temp }}/selected-release
        run: |
          set -euo pipefail
          gh release view "$TAG" --json isImmutable,isDraft --jq '.isImmutable and (.isDraft | not)' | grep -Fx true
          gh release download "$TAG" --dir "$STAGE" --pattern "$TARGET.mjs" --pattern "$TARGET.json"
          mv "$STAGE/$TARGET.mjs" "$STAGE/worker.mjs"
          mv "$STAGE/$TARGET.json" "$STAGE/manifest.json"
      - uses: vhco-pro/worker-deploy-action@586f03db605260f752621b288200c6cccd70bc72 # v0.1.0
        with:
          project: ${{ inputs.project }}
          target: ${{ inputs.target }}
          worker: ${{ vars.WORKER_NAME }}
          tag: ${{ inputs.tag }}
          commit: ${{ needs.identity.outputs.commit }}
          artifact: ${{ runner.temp }}/selected-release
          account: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          rehearse: ${{ inputs.operation == 'rehearse' }}
